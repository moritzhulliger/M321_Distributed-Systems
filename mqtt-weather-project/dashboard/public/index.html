<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wetterstationen</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; color: #222; }
    h1 { margin-top: 0; }
    #connection { padding: 6px 10px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
    .ok { background: #d4edda; } .error { background: #f8d7da; }
    table { border-collapse: collapse; background: white; width: 100%; max-width: 800px; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #e3eaf2; }
    .online { color: green; font-weight: bold; } .offline { color: #c00; font-weight: bold; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 25px; }
    .chart-box { background: white; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Wetterstationen live</h1>
  <div id="connection">Verbinde...</div>

  <table>
    <thead>
      <tr><th>Station</th><th>Status</th><th>Temperatur</th><th>Luftfeuchtigkeit</th><th>Letzter Empfang</th></tr>
    </thead>
    <tbody id="stations"></tbody>
  </table>

  <div class="charts">
    <div class="chart-box"><canvas id="tempChart"></canvas></div>
    <div class="chart-box"><canvas id="humChart"></canvas></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
