version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  station1:
    build:
      context: ./stations
      dockerfile: Dockerfile
    environment:
      - STATION_ID=WS-01
      - INTERVAL=5
    depends_on:
      - mosquitto
    restart: on-failure

  station2:
    build:
      context: ./stations
      dockerfile: Dockerfile
    environment:
      - STATION_ID=WS-02
      - INTERVAL=7
    depends_on:
      - mosquitto
    restart: on-failure

  station3:
    build:
      context: ./stations
      dockerfile: Dockerfile
    environment:
      - STATION_ID=WS-03
      - INTERVAL=3
    depends_on:
      - mosquitto
    restart: on-failure

  monitor:
    build: ./monitor
    environment:
      - MQTT_URL=tcp://mosquitto:1883
      - TIMEOUT_SECONDS=30
    depends_on:
      - mosquitto
    restart: unless-stopped

  alerts:
    build: ./alerts
    environment:
      - MQTT_URL=tcp://mosquitto:1883
      - FROST_BELOW=0
      - HEAT_ABOVE=28
      - HUMIDITY_ABOVE=55
    volumes:
      - ./alerts/logs:/app/logs
    depends_on:
      - mosquitto
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "8080:80"
    depends_on:
      - mosquitto
    restart: unless-stopped