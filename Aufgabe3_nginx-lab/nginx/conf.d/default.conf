# Reverse proxy routing by Host header.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream service_a {
    server service-a:3000;
}

upstream service_b {
    server service-b:3000;
}

upstream service_c {
    server service-c:3000;
}

server {
    listen 80;
    server_name service-a.local;

    location / {
        proxy_pass http://service_a;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name service-b.local;

    location / {
        proxy_pass http://service_b;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name service-c.local;

    location / {
        proxy_pass http://service_c;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        default_type text/plain;
        return 404 "Unbekannter Host. Verwende service-a.local, service-b.local oder service-c.local.\n";
    }
}
