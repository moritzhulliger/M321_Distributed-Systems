# =============================================================================
# Aktuell tut NGINX nur eines: auf Port 80 antworten. Eure Aufgabe ist es,
# hier die server-Bloecke fuer den Load Balancer und Reverse Proxy zu konfigurieren. 
#
# Tipp: Ihr koennt diese Datei direkt erweitern oder eigene .conf-Dateien in
# diesem Ordner (nginx/conf.d/) anlegen - alles hier wird automatisch von
# NGINX eingelesen (siehe "include /etc/nginx/conf.d/*.conf;" im Basis-Image).
#
# Nach jeder Aenderung an diesen Dateien:
#   docker compose exec nginx nginx -t        # Syntax pruefen
#   docker compose exec nginx nginx -s reload # Config neu laden (kein Neustart noetig)
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    location / {
        default_type text/plain;
        return 200 "NGINX laeuft. Jetzt seid ihr dran: konfiguriert den Reverse Proxy! Siehe docs/AUFGABENSTELLUNG.md\n";
    }
}
